app = "tac-cloud"
primary_region = "iad"

[build]
  # Build context is set via the deploy command (CWD of `fly deploy`).
  # Dockerfile is at the template root.
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_OPTIONS = "--max-old-space-size=800"     # ~80% of the 1GB cap; prevents OOM-kill
  TWILIO_VOICE_PUBLIC_DOMAIN = "tac-cloud.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
